name: 'Magento Extension PHPCS'
description: 'Checks the coding standard of a Magento 2 extension with the PHPCS and Magento coding standard versions of one Magento release'
author: 'lbajsarowicz'

inputs:
  magento-version:
    description: 'Exact Magento Open Source release, such as `2.4.8-p5`.'
    required: true
  php-version:
    description: >-
      PHP minor that the job is expected to provide, such as `8.4`. The action fails when the PHP
      on the PATH is another version. Empty accepts whatever PHP the job has.
    required: false
    default: ''
  package-version:
    description: >-
      Version the checkout is installed as. Empty lets Composer pick a `dev-` version; `tag` uses
      the nearest tag reachable from the checkout (needs `fetch-depth: 0` in `actions/checkout`); or an exact version such as `1.4.0`. Set it when a dependency requires
      the extension at a version constraint.
    required: false
    default: ''
  path:
    description: 'Directory in the workspace that holds the extension (its `composer.json`).'
    required: false
    default: '.'
  config:
    description: >-
      Path in the workspace to a PHPCS ruleset. Empty uses `.phpcs.xml`, `phpcs.xml`,
      `.phpcs.xml.dist` or `phpcs.xml.dist` from the extension, and without one the official
      Magento 2 coding standard.
    required: false
    default: ''
  severity:
    description: >-
      Findings at or above this severity fail the check. Empty means 10 with the Magento 2
      default, and "whatever the ruleset reports as an error" with a repository ruleset.
    required: false
    default: ''
  scope:
    description: >-
      `changed` checks only the PHP files touched by the pull request or push; `all` checks every
      file; `lines` checks the changed files but fails only on findings in the changed lines.
    required: false
    default: 'changed'
  annotations:
    description: >-
      Show findings inline on the changed lines of a pull request. Set to `false` in all but one
      job when the check runs in several matrix jobs.
    required: false
    default: 'true'
  github-token:
    description: 'Used only to read the list of files changed by the pull request or push.'
    required: false
    default: ${{ github.token }}
  composer-repositories:
    description: >-
      JSON list in the format of Composer's `repositories` section. It replaces the public
      Magento mirror and, when it switches packagist.org off, Packagist as the source of every
      dependency. The checkout stays the only source of the extension itself.
    required: false
    default: ''

outputs:
  status:
    description: '`passed` or `failed`.'
    value: ${{ steps.run.outputs.status }}
  result-path:
    description: 'Directory holding `results.json` and the log of every check.'
    value: ${{ steps.run.outputs.result-path }}

runs:
  using: 'composite'
  steps:
    - name: Detect an already prepared job
      id: prepared
      shell: bash
      env:
        MEC_WORK_DIR: ${{ runner.temp }}/magento-extension-check
        MEC_CACHE_ID: magento${{ inputs.magento-version }}
      run: node "$GITHUB_ACTION_PATH/../src/cli.js" prepare

    - name: Locate Composer cache
      if: ${{ steps.prepared.outputs.cache != 'true' }}
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      if: ${{ steps.prepared.outputs.cache != 'true' }}
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: magento-extension-check-${{ runner.os }}-php${{ steps.prepared.outputs.php-version }}-magento${{ inputs.magento-version }}-${{ hashFiles(format('{0}/composer.json', inputs.path)) }}
        restore-keys: |
          magento-extension-check-${{ runner.os }}-php${{ steps.prepared.outputs.php-version }}-magento${{ inputs.magento-version }}-

    - name: List changed files
      shell: bash
      env:
        MEC_TOKEN: ${{ inputs.github-token }}
        MEC_WORK_DIR: ${{ runner.temp }}/magento-extension-check
      run: node "$GITHUB_ACTION_PATH/../src/cli.js" changed-files

    - name: Run PHPCS
      id: run
      shell: bash
      env:
        MEC_PHP_VERSION: ${{ inputs.php-version }}
        MEC_MAGENTO_VERSION: ${{ inputs.magento-version }}
        MEC_CHECKS: install,phpcs
        MEC_PATH: ${{ inputs.path }}
        MEC_COMPOSER_REPOSITORIES: ${{ inputs.composer-repositories }}
        MEC_PHPCS_SEVERITY: ${{ inputs.severity }}
        MEC_PHPCS_SCOPE: ${{ inputs.scope }}
        MEC_PHPCS_CONFIG: ${{ inputs.config }}
        MEC_PHPSTAN_LEVEL: '1'
        MEC_PHPSTAN_SCOPE: 'all'
        MEC_PACKAGE_VERSION: ${{ inputs.package-version }}
        MEC_PHPSTAN_CONFIG: ''
        MEC_PHPSTAN_BASELINE: ''
        MEC_ANNOTATIONS: ${{ inputs.annotations }}
        MEC_WORK_DIR: ${{ runner.temp }}/magento-extension-check
      run: node "$GITHUB_ACTION_PATH/../src/cli.js" run
