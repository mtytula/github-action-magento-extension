name: 'Magento Extension PHPUnit'
description: 'Runs the unit or integration tests of a Magento 2 extension with the PHPUnit version of one Magento release'
author: 'lbajsarowicz'

inputs:
  magento-version:
    description: 'Exact Magento Open Source release, such as `2.4.8-p5`.'
    required: true
  php-version:
    description: >-
      PHP minor that the job is expected to provide, such as `8.4`. The action fails when the PHP
      on the PATH is another version. Empty accepts whatever PHP the job has.
    required: false
    default: ''
  package-version:
    description: >-
      Version the checkout is installed as. Empty lets Composer pick a `dev-` version; `tag` uses
      the nearest tag reachable from the checkout (needs `fetch-depth: 0` in `actions/checkout`); or an exact version such as `1.4.0`. Set it when a dependency requires
      the extension at a version constraint.
    required: false
    default: ''
  path:
    description: 'Directory in the workspace that holds the extension (its `composer.json`).'
    required: false
    default: '.'
  suite:
    description: >-
      `unit` runs `Test/Unit` and needs no services. `integration` runs `Test/Integration` with
      Magento's integration framework and needs a MySQL or MariaDB service and an OpenSearch
      service in the job.
    required: false
    default: 'unit'
  testdox:
    description: 'Print the name of every test as a readable sentence (PHPUnit `--testdox`).'
    required: false
    default: 'false'
  db-host:
    description: 'Database host for integration tests.'
    required: false
    default: '127.0.0.1'
  db-port:
    description: 'Database port for integration tests.'
    required: false
    default: '3306'
  db-user:
    description: 'Database user for integration tests.'
    required: false
    default: 'root'
  db-password:
    description: 'Database password for integration tests.'
    required: false
    default: ''
  db-name:
    description: 'Database that the integration framework installs Magento into.'
    required: false
    default: 'magento_integration_tests'
  search-engine:
    description: '`opensearch`, `elasticsearch7` or `elasticsearch8`.'
    required: false
    default: 'opensearch'
  search-host:
    description: 'Search engine host for integration tests.'
    required: false
    default: '127.0.0.1'
  search-port:
    description: 'Search engine port for integration tests.'
    required: false
    default: '9200'
  composer-repositories:
    description: >-
      JSON list in the format of Composer's `repositories` section. It replaces the public
      Magento mirror and, when it switches packagist.org off, Packagist as the source of every
      dependency. The checkout stays the only source of the extension itself.
    required: false
    default: ''

outputs:
  status:
    description: '`passed` or `failed`.'
    value: ${{ steps.run.outputs.status }}
  result-path:
    description: 'Directory holding `results.json` and the log of every check.'
    value: ${{ steps.run.outputs.result-path }}

runs:
  using: 'composite'
  steps:
    - name: Detect an already prepared job
      id: prepared
      shell: bash
      env:
        MEC_WORK_DIR: ${{ runner.temp }}/magento-extension-check
        MEC_CACHE_ID: magento${{ inputs.magento-version }}
      run: node "$GITHUB_ACTION_PATH/../src/cli.js" prepare

    - name: Locate Composer cache
      if: ${{ steps.prepared.outputs.cache != 'true' }}
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      if: ${{ steps.prepared.outputs.cache != 'true' }}
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: magento-extension-check-${{ runner.os }}-php${{ steps.prepared.outputs.php-version }}-magento${{ inputs.magento-version }}-${{ hashFiles(format('{0}/composer.json', inputs.path)) }}
        restore-keys: |
          magento-extension-check-${{ runner.os }}-php${{ steps.prepared.outputs.php-version }}-magento${{ inputs.magento-version }}-

    - name: Run tests
      id: run
      shell: bash
      env:
        MEC_PHP_VERSION: ${{ inputs.php-version }}
        MEC_MAGENTO_VERSION: ${{ inputs.magento-version }}
        MEC_CHECKS: ${{ inputs.suite == 'integration' && 'install,integration' || 'install,unit' }}
        MEC_PATH: ${{ inputs.path }}
        MEC_COMPOSER_REPOSITORIES: ${{ inputs.composer-repositories }}
        MEC_PHPCS_SEVERITY: ''
        MEC_PHPCS_SCOPE: changed
        MEC_PHPCS_CONFIG: ''
        MEC_PHPSTAN_LEVEL: '1'
        MEC_PHPSTAN_SCOPE: 'all'
        MEC_PACKAGE_VERSION: ${{ inputs.package-version }}
        MEC_PHPSTAN_CONFIG: ''
        MEC_PHPSTAN_BASELINE: ''
        MEC_ANNOTATIONS: 'false'
        MEC_PHPUNIT_TESTDOX: ${{ inputs.testdox }}
        MEC_WORK_DIR: ${{ runner.temp }}/magento-extension-check
        MEC_DB_HOST: ${{ inputs.db-host }}
        MEC_DB_PORT: ${{ inputs.db-port }}
        MEC_DB_USER: ${{ inputs.db-user }}
        MEC_DB_PASSWORD: ${{ inputs.db-password }}
        MEC_DB_NAME: ${{ inputs.db-name }}
        MEC_SEARCH_ENGINE: ${{ inputs.search-engine }}
        MEC_SEARCH_HOST: ${{ inputs.search-host }}
        MEC_SEARCH_PORT: ${{ inputs.search-port }}
      run: node "$GITHUB_ACTION_PATH/../src/cli.js" run
