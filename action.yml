name: 'Magento Extension Check'
description: 'Check a Magento 2 extension against a Magento release and PHP version: PHPCS, install, DI compile, PHPUnit, PHPStan'
author: 'lbajsarowicz'

inputs:
  php-version:
    description: >-
      PHP minor that the job is expected to provide, such as `8.4`. The action fails when the PHP
      on the PATH is another version. Empty accepts whatever PHP the job has.
    required: false
    default: ''
  magento-version:
    description: >-
      Exact Magento Open Source release, such as `2.4.8-p5`. Required for the checks that need
      Magento (`install`, `compile`, `unit`, `phpstan`); leave empty for static checks only.
    required: false
    default: ''
  checks:
    description: >-
      Comma-separated list of checks to run. Available: `validate`, `lint`, `phpcs`, `install`,
      `compile`, `unit`, `phpstan`. `default` runs every check the given inputs allow.
    required: false
    default: 'default'
  path:
    description: 'Directory in the workspace that holds the extension (its `composer.json`).'
    required: false
    default: '.'
  phpcs-config:
    description: >-
      Path in the workspace to a PHPCS ruleset. Empty uses `.phpcs.xml`, `phpcs.xml`,
      `.phpcs.xml.dist` or `phpcs.xml.dist` from the extension, and without one the official
      Magento 2 coding standard.
    required: false
    default: ''
  phpcs-severity:
    description: >-
      Findings at or above this severity fail the check. Empty means 10 with the Magento 2
      default, and "whatever the ruleset reports as an error" with a repository ruleset.
    required: false
    default: ''
  phpstan-config:
    description: >-
      Path in the workspace to a PHPStan configuration. Empty uses `phpstan.neon`,
      `phpstan.neon.dist` or `phpstan.dist.neon` from the extension, and without one a default
      with the Magento extension for PHPStan.
    required: false
    default: ''
  phpstan-baseline:
    description: 'Path in the workspace to a PHPStan baseline, loaded on top of the default configuration.'
    required: false
    default: ''
  phpcs-scope:
    description: >-
      `changed` checks only the PHP files touched by the pull request or push; `all` checks every
      file; `lines` checks the changed files but fails only on findings in the changed lines. Falls
      back to every file when the changed files cannot be determined. For exact lines of a pull
      request check out with `fetch-depth: 2`; otherwise the lines come from the GitHub API diff.
    required: false
    default: 'changed'
  annotations:
    description: >-
      Show PHPCS and PHPStan findings inline on the changed lines of a pull request. Set to
      `false` in all but one job when the same check runs in several matrix jobs.
    required: false
    default: 'true'
  github-token:
    description: 'Used only to read the list of files changed by the pull request or push.'
    required: false
    default: ${{ github.token }}
  phpstan-level:
    description: 'PHPStan rule level of the default configuration.'
    required: false
    default: '1'
  phpstan-scope:
    description: >-
      `all` fails on any finding in the extension; `changed` fails only on findings in the files
      touched by the pull request or push; `lines` only on findings in the changed lines. General
      errors always fail. Steps down to `changed`, then `all`, when the changed lines or files
      cannot be determined. For exact lines of a pull request check out with `fetch-depth: 2`;
      otherwise the lines come from the GitHub API diff.
    required: false
    default: 'all'
  phpunit-testdox:
    description: 'Print the name of every test as a readable sentence (PHPUnit `--testdox`).'
    required: false
    default: 'false'
  composer-repositories:
    description: >-
      JSON list in the format of Composer's `repositories` section. It replaces the public
      Magento mirror and, when it switches packagist.org off, Packagist as the source of every
      dependency. The checkout stays the only source of the extension itself.
    required: false
    default: ''

outputs:
  status:
    description: '`passed` or `failed`.'
    value: ${{ steps.run.outputs.status }}
  result-path:
    description: 'Directory holding `results.json` and the log of every check.'
    value: ${{ steps.run.outputs.result-path }}

runs:
  using: 'composite'
  steps:
    - name: Detect an already prepared job
      id: prepared
      shell: bash
      env:
        MEC_WORK_DIR: ${{ runner.temp }}/magento-extension-check
        MEC_CACHE_ID: magento${{ inputs.magento-version }}
      run: node "$GITHUB_ACTION_PATH/src/cli.js" prepare

    - name: Locate Composer cache
      if: ${{ steps.prepared.outputs.cache != 'true' }}
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      if: ${{ steps.prepared.outputs.cache != 'true' }}
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: magento-extension-check-${{ runner.os }}-php${{ steps.prepared.outputs.php-version }}-magento${{ inputs.magento-version || 'none' }}-${{ hashFiles(format('{0}/composer.json', inputs.path)) }}
        restore-keys: |
          magento-extension-check-${{ runner.os }}-php${{ steps.prepared.outputs.php-version }}-magento${{ inputs.magento-version || 'none' }}-

    - name: List changed files
      if: ${{ inputs.phpcs-scope != 'all' || inputs.phpstan-scope != 'all' || inputs.annotations == 'true' }}
      shell: bash
      env:
        MEC_TOKEN: ${{ inputs.github-token }}
        MEC_WORK_DIR: ${{ runner.temp }}/magento-extension-check
      run: node "$GITHUB_ACTION_PATH/src/cli.js" changed-files

    - name: Run checks
      id: run
      shell: bash
      env:
        MEC_PHP_VERSION: ${{ inputs.php-version }}
        MEC_MAGENTO_VERSION: ${{ inputs.magento-version }}
        MEC_CHECKS: ${{ inputs.checks }}
        MEC_PATH: ${{ inputs.path }}
        MEC_COMPOSER_REPOSITORIES: ${{ inputs.composer-repositories }}
        MEC_PHPCS_SEVERITY: ${{ inputs.phpcs-severity }}
        MEC_PHPSTAN_LEVEL: ${{ inputs.phpstan-level }}
        MEC_PHPSTAN_SCOPE: ${{ inputs.phpstan-scope }}
        MEC_PHPCS_SCOPE: ${{ inputs.phpcs-scope }}
        MEC_PHPCS_CONFIG: ${{ inputs.phpcs-config }}
        MEC_PHPSTAN_CONFIG: ${{ inputs.phpstan-config }}
        MEC_PHPSTAN_BASELINE: ${{ inputs.phpstan-baseline }}
        MEC_ANNOTATIONS: ${{ inputs.annotations }}
        MEC_PHPUNIT_TESTDOX: ${{ inputs.phpunit-testdox }}
        MEC_WORK_DIR: ${{ runner.temp }}/magento-extension-check
      run: node "$GITHUB_ACTION_PATH/src/cli.js" run

branding:
  icon: 'check-square'
  color: 'orange'
