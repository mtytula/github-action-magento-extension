name: 'Magento Extension Static Checks'
description: 'Checks a Magento 2 extension on one PHP version without installing Magento: Composer metadata, PHP syntax, coding standard'
author: 'lbajsarowicz'

inputs:
  magento-version:
    description: >-
      Only labels the result. Set it when the static checks are a step of a job that goes on to
      check one Magento release, so that the report lists them under that release.
    required: false
    default: ''
  php-version:
    description: >-
      PHP minor that the job is expected to provide, such as `8.4`. The action fails when the PHP
      on the PATH is another version. Empty accepts whatever PHP the job has.
    required: false
    default: ''
  checks:
    description: 'Comma-separated list of checks to run. Available: `validate`, `lint`, `phpcs`.'
    required: false
    default: 'validate,lint,phpcs'
  path:
    description: 'Directory in the workspace that holds the extension (its `composer.json`).'
    required: false
    default: '.'
  phpcs-config:
    description: >-
      Path in the workspace to a PHPCS ruleset. Empty uses `.phpcs.xml`, `phpcs.xml`,
      `.phpcs.xml.dist` or `phpcs.xml.dist` from the extension, and without one the official
      Magento 2 coding standard.
    required: false
    default: ''
  phpcs-severity:
    description: >-
      Findings at or above this severity fail the check. Empty means 10 with the Magento 2
      default, and "whatever the ruleset reports as an error" with a repository ruleset.
    required: false
    default: ''
  phpcs-scope:
    description: >-
      `changed` checks only the PHP files touched by the pull request or push; `all` checks every
      file. Falls back to every file when the changed files cannot be determined.
    required: false
    default: 'changed'
  annotations:
    description: >-
      Show PHPCS findings inline on the changed lines of a pull request. Set to `false` in all
      but one job when the checks run on several PHP versions.
    required: false
    default: 'true'
  github-token:
    description: 'Used only to read the list of files changed by the pull request or push.'
    required: false
    default: ${{ github.token }}
  composer-repositories:
    description: >-
      JSON list in the format of Composer's `repositories` section. It replaces the public
      Magento mirror and, when it switches packagist.org off, Packagist as the source of every
      dependency. The checkout stays the only source of the extension itself.
    required: false
    default: ''
  composer-cache:
    description: >-
      `actions` caches Composer downloads with `actions/cache`; `none` leaves them to the runner,
      for example a self-hosted runner with a persistent `COMPOSER_CACHE_DIR`.
    required: false
    default: 'actions'

outputs:
  status:
    description: '`passed` or `failed`.'
    value: ${{ steps.run.outputs.status }}
  result-path:
    description: 'Directory holding `results.json` and the log of every check.'
    value: ${{ steps.run.outputs.result-path }}

runs:
  using: 'composite'
  steps:
    - name: Reject checks that need Magento
      shell: bash
      env:
        MEC_CHECKS: ${{ inputs.checks }}
      run: |
        for check in ${MEC_CHECKS//,/ }; do
          case "$check" in
            validate|lint|phpcs) ;;
            *) echo "::error title=Magento Extension Static Checks::'${check}' is not a static check. Available: validate, lint, phpcs."; exit 1 ;;
          esac
        done

    - name: Detect an already prepared job
      id: prepared
      shell: bash
      env:
        MEC_WORK_DIR: ${{ runner.temp }}/magento-extension-check
        MEC_COMPOSER_CACHE: ${{ inputs.composer-cache }}
        MEC_CACHE_ID: static
      run: node "$GITHUB_ACTION_PATH/../src/cli.js" prepare

    - name: Locate Composer cache
      if: ${{ steps.prepared.outputs.cache != 'true' && inputs.composer-cache != 'none' }}
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      if: ${{ steps.prepared.outputs.cache != 'true' && inputs.composer-cache != 'none' }}
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: magento-extension-check-static-${{ runner.os }}-php${{ steps.prepared.outputs.php-version }}-${{ hashFiles(format('{0}/composer.json', inputs.path)) }}
        restore-keys: |
          magento-extension-check-static-${{ runner.os }}-php${{ steps.prepared.outputs.php-version }}-

    - name: List changed files
      if: ${{ inputs.phpcs-scope == 'changed' || inputs.annotations == 'true' }}
      shell: bash
      env:
        MEC_TOKEN: ${{ inputs.github-token }}
        MEC_WORK_DIR: ${{ runner.temp }}/magento-extension-check
      run: node "$GITHUB_ACTION_PATH/../src/cli.js" changed-files

    - name: Run static checks
      id: run
      shell: bash
      env:
        MEC_PHP_VERSION: ${{ inputs.php-version }}
        MEC_MAGENTO_VERSION: ${{ inputs.magento-version }}
        MEC_CHECKS: ${{ inputs.checks }}
        MEC_PATH: ${{ inputs.path }}
        MEC_COMPOSER_REPOSITORIES: ${{ inputs.composer-repositories }}
        MEC_PHPCS_SEVERITY: ${{ inputs.phpcs-severity }}
        MEC_PHPCS_SCOPE: ${{ inputs.phpcs-scope }}
        MEC_PHPCS_CONFIG: ${{ inputs.phpcs-config }}
        MEC_PHPSTAN_LEVEL: '1'
        MEC_PHPSTAN_CONFIG: ''
        MEC_PHPSTAN_BASELINE: ''
        MEC_ANNOTATIONS: ${{ inputs.annotations }}
        MEC_WORK_DIR: ${{ runner.temp }}/magento-extension-check
      run: node "$GITHUB_ACTION_PATH/../src/cli.js" run
